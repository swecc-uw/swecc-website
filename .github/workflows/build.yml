name: Build
on: pull_request
jobs:
  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: useblacksmith/checkout@v1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
